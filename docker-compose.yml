# ChatNow local & multi-instance infrastructure.
#
# Common commands (Windows 11 PowerShell):
#   1) Database + Redis only (for local `npm run dev`):
#        docker compose up -d postgres redis
#   2) Full multi-instance stack (PostgreSQL + Redis + api-1 + api-2 + frontend + Nginx LB):
#        docker compose --profile full up -d --build
#   3) Full stack + ELK observability (Elasticsearch + Logstash + Kibana on :5601):
#        docker compose --profile full --profile elk up -d --build
#
# Values come from `.env` (next to this file) and `backend/.env` (JWT secret).

name: chatnow

x-api-common: &api-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ./backend/.env
  environment:
    NODE_ENV: production
    PORT: 4000
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
    REDIS_URL: redis://redis:6379
    REDIS_ADAPTER_ENABLED: "true"
    RATE_LIMIT_STORE: redis
    TRUST_PROXY: 1
    COOKIE_SECURE: "false"
    CORS_ORIGINS: http://localhost:${NGINX_PORT:-8080},http://localhost:5174
    LOGSTASH_HOST: logstash
    LOGSTASH_PORT: 5044
    UPLOAD_DIR: /app/uploads
  volumes:
    - uploads-data:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - chatnow-net

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Host port 5434 because native PostgreSQL servers already use 5432 and 5433 on this machine.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatnow-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatnow-net

  # One-shot migration runner so api-1 and api-2 never race on schema creation.
  migrate:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - chatnow-net

  api-1:
    <<: *api-common
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: api-1
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ADAPTER_ENABLED: "true"
      RATE_LIMIT_STORE: redis
      TRUST_PROXY: 1
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:${NGINX_PORT:-8080},http://localhost:5174
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
      UPLOAD_DIR: /app/uploads
    ports:
      # Direct port exposed on loopback for multi-instance verification tests
      - "127.0.0.1:${API_1_PORT:-4001}:4000"

  api-2:
    <<: *api-common
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: api-2
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ADAPTER_ENABLED: "true"
      RATE_LIMIT_STORE: redis
      TRUST_PROXY: 1
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:${NGINX_PORT:-8080},http://localhost:5174
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:${API_2_PORT:-4002}:4000"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - chatnow-net

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chatnow-net

  # --- ELK Observability Stack (opt-in profile: ~2-3 GB RAM) -----------------
  elasticsearch:
    profiles: ["elk"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks:
      - chatnow-net

  logstash:
    profiles: ["elk"]
    image: docker.elastic.co/logstash/logstash:8.17.4
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./infrastructure/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infrastructure/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "127.0.0.1:5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - chatnow-net

  kibana:
    profiles: ["elk"]
    image: docker.elastic.co/kibana/kibana:8.17.4
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Do not send usage telemetry from this local stack to Elastic.
      - TELEMETRY_OPTIN=false
      - TELEMETRY_ALLOWCHANGINGOPTINSTATUS=false
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - chatnow-net

volumes:
  postgres-data:
  uploads-data:
  es-data:

networks:
  chatnow-net:
    driver: bridge
