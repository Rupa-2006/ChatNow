# ChatNow Logstash pipeline: receives redacted Pino JSON logs over TCP from api-1 / api-2,
# enforces defense-in-depth removal of any sensitive fields, normalizes level labels, and
# indexes daily into Elasticsearch (`chatnow-logs-YYYY.MM.dd`).

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Defense-in-depth: even though Pino redacts before shipping, explicitly drop any
  # sensitive keys if they ever appear in an event payload.
  mutate {
    remove_field => [
      "password",
      "currentPassword",
      "newPassword",
      "passwordHash",
      "token",
      "accessToken",
      "refreshToken",
      "tokenHash",
      "content",
      "[req][headers][authorization]",
      "[req][headers][cookie]",
      "[res][headers][set-cookie]"
    ]
  }

  # Map numeric Pino levels to human-readable severity names for Kibana filters.
  if [level] == 10 {
    mutate { replace => { "level_name" => "trace" } }
  } else if [level] == 20 {
    mutate { replace => { "level_name" => "debug" } }
  } else if [level] == 30 {
    mutate { replace => { "level_name" => "info" } }
  } else if [level] == 40 {
    mutate { replace => { "level_name" => "warn" } }
  } else if [level] == 50 {
    mutate { replace => { "level_name" => "error" } }
  } else if [level] == 60 {
    mutate { replace => { "level_name" => "fatal" } }
  }

  # Categorize high-level observability domains for Kibana dashboards
  if [event] =~ /^auth\./ {
    mutate { add_field => { "log_category" => "authentication" } }
  } else if [event] =~ /^socket\./ or [event] =~ /^presence\./ {
    mutate { add_field => { "log_category" => "websocket" } }
  } else if [event] =~ /^message\./ {
    mutate { add_field => { "log_category" => "messaging" } }
  } else if [event] =~ /^api\./ {
    mutate { add_field => { "log_category" => "http_api" } }
  } else if [event] =~ /^server\./ or [event] =~ /^redis\./ {
    mutate { add_field => { "log_category" => "infrastructure" } }
  } else {
    mutate { add_field => { "log_category" => "application" } }
  }

  if [time] {
    date {
      match => [ "time", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "chatnow-logs-%{+YYYY.MM.dd}"
  }
}
