worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Allow 10 MB attachments + multipart framing overhead
    client_max_body_size 12m;

    # Round-robin upstream across stateless ChatNow API instances.
    # Because Socket.IO uses WebSocket-only transport and Redis Pub/Sub adapter,
    # no sticky sessions are required.
    upstream chatnow_api {
        server api-1:4000 max_fails=3 fail_timeout=10s;
        server api-2:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream chatnow_frontend {
        server frontend:80;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Security headers at the edge
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # REST API -> round-robin across api-1 and api-2
        location /api/ {
            proxy_pass http://chatnow_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Socket.IO WebSocket upgrade -> round-robin across api-1 and api-2
        location /socket.io/ {
            proxy_pass http://chatnow_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # React SPA
        location / {
            proxy_pass http://chatnow_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
