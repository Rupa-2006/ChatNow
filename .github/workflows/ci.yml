name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Integration tests need real PostgreSQL and Redis. The test config swaps the
    # database name to "chatnow_test" and uses Redis logical database 1.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatnow
          POSTGRES_PASSWORD: chatnow
          POSTGRES_DB: chatnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chatnow:chatnow@localhost:5432/chatnow
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatnow
          POSTGRES_PASSWORD: chatnow
          POSTGRES_DB: chatnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Single-origin setup, like the Render deploy: the API serves the built frontend.
    env:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://chatnow:chatnow@localhost:5432/chatnow
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: http://localhost:4000
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORE: memory
      FRONTEND_DIST: ../frontend/dist
      E2E_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build and start backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          nohup node dist/server.js > ../api.log 2>&1 &
          npx --yes wait-on -t 60000 http://localhost:4000/api/health
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Show API log
        if: failure()
        run: cat api.log
