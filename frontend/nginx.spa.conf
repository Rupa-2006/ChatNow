server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immutable cache for content-hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback so client-side routes (/chat, /profile, /settings) work on reload
    location / {
        try_files $uri $uri/ /index.html;
    }
}
