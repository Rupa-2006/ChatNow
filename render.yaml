# Render Blueprint for ChatNow Backend (WebSockets + REST API).
# Connect your GitHub repository in Render Dashboard -> Blueprints and fill in the
# secret values marked `sync: false` (Neon DATABASE_URL, Upstash REDIS_URL, JWT secret).

services:
  - type: web
    name: chatnow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: render-api-1
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: RATE_LIMIT_STORE
        value: redis
      - key: REDIS_ADAPTER_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
